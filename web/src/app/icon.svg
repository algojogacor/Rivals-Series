<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3ec9e6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e141d"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Dark Crest Base -->
  <polygon points="32,2 58,16 58,48 32,62 6,48 6,16" fill="url(#bgGrad)" stroke="#1a2230" stroke-width="2"/>

  <!-- Left Cyan Wing / Slash (Pemain A) -->
  <path d="M12,20 L28,12 L28,52 L12,44 Z" fill="url(#cyanGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Right Purple Wing / Slash (Pemain B) -->
  <path d="M52,20 L36,12 L36,52 L52,44 Z" fill="url(#purpleGrad)" opacity="0.9" filter="url(#glow)"/>

  <!-- Center Tactical Pitch Line Divider -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>

  <!-- Center Ball / Arena Focus Dot -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2" fill="#070a0e"/>

  <!-- Top Crown Accent -->
  <polygon points="32,6 35,11 29,11" fill="#f59e0b"/>
</svg>
